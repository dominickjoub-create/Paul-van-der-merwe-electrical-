      <stop offset="55%" stop-color="#0d0d0e"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE68A"/>
      <stop offset="100%" stop-color="#FFC400"/>
