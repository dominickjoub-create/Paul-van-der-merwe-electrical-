  <text x="96" y="470" font-family="'Archivo',sans-serif" font-size="40" fill="#F5F5F2" font-weight="700">Quality work. Honest service.</text>
  <text x="96" y="524" font-family="'Hanken Grotesk',Arial,sans-serif" font-size="30" fill="#A1A1A6">Powering homes &amp; businesses — residential, commercial, solar &amp; more.</text>

